[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptochunk"
version = "1.0.0"
description = "Authenticated chunked storage with 4+2 erasure coding and integrity verification"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Krishna Mahajan"}]
dependencies = []

[project.scripts]
cryptochunk = "cryptochunk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
